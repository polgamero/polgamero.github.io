<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGENTINIA - TCG Criollo</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div id="game-app">
    <main id="board">
      <!-- MANO RIVAL (OCULTA) -->
      <section id="rival-hand" class="hand-row rival-hand"></section>

      <!-- CAMPO RIVAL -->
      <section class="field-zone-container">
        <div id="rival-wrapper" class="lands-support-wrapper">
          <div id="rival-lands" class="field-row lands-row" style="flex: 6;"></div>
          <div id="rival-support" class="field-row support-row" style="flex: 3;"></div>
          <div id="rival-planeswalkers" class="field-row planeswalker-row" style="flex: 3;"></div>
        </div>
        <div id="rival-combat" class="field-row combat-row"></div>
      </section>

      <!-- TU CAMPO -->
      <section class="field-zone-container">
        <div id="local-combat" class="field-row combat-row"></div>
        <div id="local-wrapper" class="lands-support-wrapper">
          <div id="local-lands" class="field-row lands-row" style="flex: 6;"></div>
          <div id="local-support" class="field-row support-row" style="flex: 3;"></div>
          <div id="local-planeswalkers" class="field-row planeswalker-row" style="flex: 3;"></div>
        </div>
      </section>

      <!-- TU MANO -->
      <section id="local-hand" class="hand-row local-hand"></section>
    </main>

    <!-- HUD LATERAL DERECHO -->
    <aside id="sidebar-hud">
      <div class="player-card rival-card">
        <div class="avatar" id="rival-avatar">🤠</div>
        <div class="player-info">
          <h3>El Tano (TU RIVAL)</h3>
          <div class="hp-bar-container">
            <div id="rival-hp-bar" class="hp-fill" style="width: 100%;"></div>
          </div>
          <span id="rival-hp-text" class="hp-text">20 / 20 HP</span>
        </div>
      </div>

      <div class="log-section">
        <div class="log-box" id="game-log-box"></div>
        
        <!-- INDICADOR DE TURNO ACTIVO -->
        <div id="turn-owner-badge" class="turn-owner-badge">Turno de: El Gaucho</div>

        <!-- INDICADORES DE FASES Y SUBFASES MTG -->
        <div id="phase-indicator-container" class="phase-indicator">
          <div class="phase-dot" id="dot-upkeep" title="Mantenimiento / Robo">Mantenimiento</div>
          <div class="phase-dot" id="dot-main1" title="1ra Fase Principal">Main 1</div>
          <div class="phase-dot" id="dot-combat" title="Fase de Combate">
            Combate
            <span id="combat-subphase-text" class="subphase-label"></span>
          </div>
          <div class="phase-dot" id="dot-main2" title="2da Fase Principal">Main 2</div>
          <div class="phase-dot" id="dot-end" title="Paso Final">Fin</div>
        </div>

        <div id="payment-controls" class="hidden" style="margin-bottom: 10px; text-align: center;">
          <p id="payment-status" style="font-size: 0.8rem; color: var(--gold); margin-bottom: 5px; font-weight: bold;">Pagando hechizo...</p>
          <button id="btn-alt-cost" class="btn-reset hidden" style="width: 100%; background: #6c3483; border-color: #9b59b6; margin-bottom: 5px;">💉 Pagar con vida en vez de maná</button>
          <button id="btn-pay-ward" class="btn-reset hidden" style="width: 100%; background: #d68910; border-color: #f39c12; margin-bottom: 5px;">🔶 Pagar Ward</button>
          <button id="btn-pay-counter-tax" class="btn-reset hidden" style="width: 100%; background: #2874a6; border-color: #3498db; margin-bottom: 5px;">💰 Pagar el impuesto</button>
          <button id="btn-cancel-spell" class="btn-reset" style="width: 100%; background: #c0392b; border-color: #e74c3c;">❌ Cancelar (ESC)</button>
        </div>
        <div class="turn-controls">
          <button id="btn-end-turn" class="btn-turn">Pasar Prioridad ➔</button>
        </div>
      </div>

      <div class="player-card local-card">
        <div class="avatar" id="local-avatar">🧉</div>
        <div class="player-info">
          <h3>El Gaucho (VOS)</h3>
          <div class="hp-bar-container">
            <div id="local-hp-bar" class="hp-fill" style="width: 100%;"></div>
          </div>
          <span id="local-hp-text" class="hp-text">20 / 20 HP</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- OVERLAY DE FIN DE PARTIDA -->
  <div id="game-over-overlay" class="hidden">
    <div class="game-over-box">
      <h2 id="game-over-title"></h2>
      <button id="btn-restart">Jugar de Nuevo</button>
    </div>
  </div>

  <!-- Panel Flotante de la Pila / Stack -->
  <div id="stack-container" class="hidden">
    <div class="stack-header">
      <span>⚡ PILA DE HECHIZOS</span>
      <span id="stack-count">0</span>
    </div>
    <div id="stack-list" class="stack-list"></div>
    <button id="btn-resolve-top" class="btn-resolve-stack">Pasar Prioridad / Resolver ➔</button>
  </div>

  <!-- OVERLAY DE ASIGNACIÓN DE DAÑO -->
  <div id="damage-modal-overlay" class="hidden">
    <div class="damage-modal-box">
      <h2>⚔️ Asignar Daño</h2>
      <p class="damage-modal-hint">Podés seguir mirando las cartas del campo mientras decidís.</p>
      <div id="damage-modal-content"></div>
      <div id="damage-modal-initial-buttons" class="damage-modal-initial-buttons">
        <button id="btn-dmg-auto" class="btn-turn" style="background: #3498db;">Automáticamente</button>
        <button id="btn-dmg-manual" class="btn-turn" style="background: #e67e22;">Manualmente</button>
      </div>
      <div id="damage-modal-confirm-container" class="hidden">
        <button id="btn-dmg-confirm" class="btn-turn" style="background: var(--hp-green); width: 100%;">Confirmar Distribución</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="./js/main.js"></script>
</body>
</html>
