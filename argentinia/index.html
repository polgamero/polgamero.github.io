<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGENTINIA - TCG Criollo</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div id="game-app">
    <main id="board">
      <!-- MANO RIVAL (OCULTA) -->
      <section id="rival-hand" class="hand-row rival-hand"></section>

      <!-- CAMPO RIVAL -->
      <section class="field-zone-container">
        <div id="rival-lands" class="field-row lands-row" data-label="Estancias Rival"></div>
        <div id="rival-combat" class="field-row combat-row" data-label="Combate Rival"></div>
      </section>

      <!-- TU CAMPO -->
      <section class="field-zone-container">
        <div id="local-combat" class="field-row combat-row" data-label="Tu Zona de Combate"></div>
        <div id="local-lands" class="field-row lands-row" data-label="Tus Estancias"></div>
      </section>

      <!-- TU MANO -->
      <section id="local-hand" class="hand-row local-hand"></section>
    </main>

    <!-- HUD LATERAL DERECHO -->
    <aside id="sidebar-hud">
      <div class="player-card rival-card">
        <div class="avatar" id="rival-avatar">🤠</div>
        <div class="player-info">
          <h3>El Tano Rival</h3>
          <div class="hp-bar-container">
            <div id="rival-hp-bar" class="hp-fill" style="width: 100%;"></div>
          </div>
          <span id="rival-hp-text" class="hp-text">20 / 20 HP</span>
        </div>
        <div class="player-stats">
          <span class="stat mana-stat">Yerba: <strong id="rival-mana-text">0 / 0</strong></span>
          <span class="stat">Mazo: <strong id="rival-deck-count">0</strong></span>
          <span class="stat">Mano: <strong id="rival-hand-count">0</strong></span>
        </div>
      </div>

      <div class="log-section">
        <div class="log-box" id="game-log-box"></div>
        <div id="payment-controls" class="hidden" style="margin-bottom: 10px; text-align: center;">
          <p id="payment-status" style="font-size: 0.8rem; color: var(--gold); margin-bottom: 5px; font-weight: bold;">Pagando hechizo...</p>
          <button id="btn-cancel-spell" class="btn-reset" style="width: 100%; background: #c0392b; border-color: #e74c3c;">❌ Cancelar (ESC)</button>
        </div>
        <div class="turn-controls">
          <button id="btn-end-turn" class="btn-turn">Pasar Turno ➔</button>
          <button id="btn-restart-sidebar" class="btn-reset" title="Reiniciar partida">🔄 Reiniciar</button>
        </div>
      </div>

      <div class="player-card local-card">
        <div class="avatar" id="local-avatar">🧉</div>
        <div class="player-info">
          <h3>El Gaucho Máximo</h3>
          <div class="hp-bar-container">
            <div id="local-hp-bar" class="hp-fill" style="width: 100%;"></div>
          </div>
          <span id="local-hp-text" class="hp-text">20 / 20 HP</span>
        </div>
        <div class="player-stats">
          <span class="stat mana-stat">Yerba: <strong id="local-mana-text">0 / 0</strong></span>
          <span class="stat">Mazo: <strong id="local-deck-count">0</strong></span>
        </div>
      </div>
    </aside>
  </div>

  <!-- OVERLAY DE FIN DE PARTIDA -->
  <div id="game-over-overlay" class="hidden">
    <div class="game-over-box">
      <h2 id="game-over-title"></h2>
      <button id="btn-restart">Jugar de Nuevo</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
