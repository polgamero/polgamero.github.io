name: Deploy Argentinia Public Frontend to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Setup Python for deploy-time image inventory
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce public-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d argentinia
          test -f argentinia/index.html
          test -f argentinia/build-manifest.json
          test -d argentinia/js
          test -d argentinia/css
          test -d argentinia/assets/data
          test -f argentinia/assets/images/cards/cards-image-manifest.json
          test -f argentinia/cartas/index.html
          test -f .github/scripts/generate_image_manifest.py
          for icon in cofre.png taller.png logros.png perfil.png daily.png mod.png; do
            test -f "argentinia/assets/images/ui/$icon" || { echo "::error::Missing account menu icon: argentinia/assets/images/ui/$icon"; exit 1; }
          done
          echo "ACCOUNT_MENU_ICON_ASSETS_OK count=6"
          test ! -e functions
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -d argentinia/tools

          forbidden_dirs=$(find argentinia .github -type d \( -name trusted -o -name test -o -name tests -o -name node_modules \) -print)
          if [ -n "$forbidden_dirs" ]; then
            echo "::error::Private/internal directories found in public repository:"
            printf '%s\n' "$forbidden_dirs"
            exit 1
          fi

          forbidden_files=$(find argentinia -type f \( -name '*.mjs' -o -name '*.py' -o -name '*.md' -o -name '*.txt' -o -name '*.zip' -o -name '*.patch' -o -name '*.log' \) -print)
          if [ -n "$forbidden_files" ]; then
            echo "::error::Internal/test/documentation files found under public argentinia/:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          if grep -RIlE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:' argentinia .github 2>/dev/null | grep -q .; then
            echo "::error::Private-key material marker detected in public repository"
            exit 1
          fi
          echo "PUBLIC_REPOSITORY_BOUNDARY_OK runtime-only"

      - name: Regenerate live image manifest from retained repository PNGs
        shell: bash
        run: |
          set -euo pipefail
          # The release ZIP intentionally carries no card-art binaries. The real public repo does.
          # Therefore the only truthful audit is produced here, after checkout, against the PNGs
          # that GitHub actually retains and will publish.
          python .github/scripts/generate_image_manifest.py --root argentinia

          # The generator emits convenience TXT requisitions; keep the deployed surface runtime-only.
          rm -f argentinia/assets/images/cards/missing-card-images.txt \
                argentinia/assets/images/cards/missing-token-images.txt \
                argentinia/assets/images/cards/unassigned-token-images.txt \
                argentinia/assets/images/evolutions/missing-evolution-images.txt

          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('argentinia/assets/images/cards/cards-image-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          images = manifest.get('images') or {}
          existing = int(images.get('existingFileCount') or 0)
          referenced = int(images.get('referencedFaceCount') or 0)
          missing = int(images.get('missingCardCount') or 0)
          if existing <= 0:
              raise SystemExit('IMAGE_MANIFEST_DEPLOY_ERROR existingFileCount=0: deploy-time scan did not see retained card assets')
          if referenced > 0 and missing >= referenced:
              raise SystemExit(f'IMAGE_MANIFEST_DEPLOY_ERROR all referenced card faces appear missing ({missing}/{referenced})')
          expected_sha = os.environ.get('GITHUB_SHA')
          if expected_sha and manifest.get('gitSha') != expected_sha:
              raise SystemExit(f'IMAGE_MANIFEST_DEPLOY_ERROR gitSha mismatch manifest={manifest.get("gitSha")} env={expected_sha}')
          if len(manifest.get('missing') or []) != missing:
              raise SystemExit('IMAGE_MANIFEST_DEPLOY_ERROR missing[] cardinality mismatch')
          print(f'IMAGE_MANIFEST_DEPLOY_OK existing={existing} referencedFaces={referenced} missing={missing} gitSha={manifest.get("gitSha")}')
          PY

      - name: Verify prebuilt public gallery and crawler assets
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          test -f ads.txt
          test -f robots.txt
          test -f sitemap.xml
          test -f argentinia/cartas/public-selection.json
          test -f argentinia/cartas/public-cards.css
          test -f argentinia/cartas/public-cards.js
          test "$(find argentinia/cartas -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "180"
          test "$(grep -c '<loc>' sitemap.xml)" = "182"
          echo "PUBLIC_ARTIFACTS_OK gallery=180 sitemap=182"

      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-root
          mkdir -p .pages-root
          cp -a argentinia/. .pages-root/
          for name in CNAME ads.txt robots.txt sitemap.xml .nojekyll; do
            if [ -f "$name" ]; then cp "$name" ".pages-root/$name"; fi
          done

          # Este repo aloja otros sitios públicos además de Argentinia. Mantener una allowlist
          # explícita evita volver a publicar el repo completo y conserva la frontera fail-closed.
          for dir in band botonera clima cv top5 trivia privacidad terminos; do
            test -d "$dir" || { echo "::error::Missing allowed public sibling: $dir"; exit 1; }
            mkdir -p ".pages-root/$dir"
            cp -a "$dir"/. ".pages-root/$dir"/
          done
          # Assets compartidos estrictamente necesarios por las páginas legales y Top 5.
          # No se copia css/js/img completos: se enumeran los recursos conocidos para evitar
          # colisiones con el runtime de Argentinia que ya vive en la raíz del artefacto.
          for file in css/landing.css css/legal.css js/landing.js img/logoTop5.png; do
            test -f "$file" || { echo "::error::Missing allowed shared asset: $file"; exit 1; }
            mkdir -p ".pages-root/$(dirname "$file")"
            cp "$file" ".pages-root/$file"
          done
          test -d img/bandas || { echo "::error::Missing Top 5 image directory: img/bandas"; exit 1; }
          mkdir -p .pages-root/img/bandas
          cp -a img/bandas/. .pages-root/img/bandas/

          # Los documentos legales y su CSS compartido todavía pueden contener rutas
          # absolutas del esquema histórico /argentinia/. Reescribir solo esas referencias
          # conocidas mantiene los legales funcionando con Argentinia servido desde /.
          sed -i 's#/argentinia/assets/#/assets/#g; s#href="/argentinia/"#href="/"#g' \
            .pages-root/privacidad/index.html .pages-root/terminos/index.html
          sed -i 's#/argentinia/assets/#/assets/#g' .pages-root/css/landing.css

          mkdir -p .pages-root/argentinia
          cat > .pages-root/argentinia/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0;url=/"><title>Argentinia se mudó</title></head>
          <body><p>Argentinia ahora vive en <a href="/">la raíz del sitio</a>.</p>
          <script>try{const u=new URL('/',location.origin);u.search=location.search;u.hash=location.hash;location.replace(u.href);}catch{location.replace('/');}</script>
          </body></html>
          HTML
          test -f .pages-root/index.html
          test -f .pages-root/js/main.js
          test -f .pages-root/assets/manifest.webmanifest
          test -f .pages-root/assets/images/cards/cards-image-manifest.json
          test -f .pages-root/cartas/index.html
          for dir in band botonera clima cv top5 trivia privacidad terminos; do test -f ".pages-root/$dir/index.html"; done
          test -f .pages-root/css/landing.css
          test -f .pages-root/css/legal.css
          test -f .pages-root/js/landing.js
          test -f .pages-root/img/logoTop5.png
          test -d .pages-root/img/bandas
          ! grep -q '/argentinia/assets/' .pages-root/privacidad/index.html
          ! grep -q '/argentinia/assets/' .pages-root/terminos/index.html
          ! grep -q '/argentinia/assets/' .pages-root/css/landing.css
          echo "PUBLIC_PAGES_ARTIFACT_OK root=argentinia siblings=8 legal=LIVE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-root'

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
