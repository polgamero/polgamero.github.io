name: Deploy Argentinia to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only the default branch; manual runs are also allowed.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Argentinia repository layout
        run: |
          test -d argentinia
          test -f argentinia/tools/generate_image_manifest.py
          test -f argentinia/js/poolContract.js
          test -d argentinia/assets/data
          test -d argentinia/assets/images/cards
          test ! -e argentinia/firestore.rules
          test ! -e argentinia/firebase.json
          echo "OK: polgamero.github.io/argentinia layout detected; no public Firestore infra files"

      - name: Generate card image manifest and validate active pool contract
        working-directory: ./argentinia
        # Cardinality comes from js/poolContract.js. Never hardcode 511/553/583/601 here.
        run: python tools/generate_image_manifest.py --root .

      - name: Verify generated manifest
        run: |
          test -f argentinia/assets/images/cards/cards-image-manifest.json
          test -f argentinia/assets/images/cards/missing-card-images.txt
          test -f argentinia/assets/images/cards/missing-token-images.txt
          test -f argentinia/assets/images/cards/unassigned-token-images.txt
          echo "OK: card + token image manifest generated inside /argentinia"

      - name: Validate Game Texts contract
        working-directory: ./argentinia
        run: python tools/validate_game_text_contract.py --root .

      - name: Validate compact historical regression suite
        working-directory: ./argentinia
        run: |
          test -f tools/regression_legacy_23_17_3_1.zip
          test -f tools/ci_regression_manifest_23_17_3_1.txt
          # The archive is retained as a compact historical artifact, but must NEVER be
          # extracted over the live tools/ tree: doing so can overwrite tests that were
          # intentionally updated for newer engine/rules/protocol baselines.
          python - <<'PY'
          from pathlib import Path
          import zipfile
          tools = Path('tools')
          names = [line.strip() for line in (tools / 'ci_regression_manifest_23_17_3_1.txt').read_text(encoding='utf-8').splitlines()
                   if line.strip() and not line.lstrip().startswith('#')]
          with zipfile.ZipFile(tools / 'regression_legacy_23_17_3_1.zip') as z:
              archived = set(z.namelist())
              for name in names:
                  live = tools / name
                  if not live.is_file():
                      raise SystemExit(f'Missing live regression test: {name}')
                  if name not in archived:
                      raise SystemExit(f'Missing regression archive entry: {name}')
                  if z.read(name) != live.read_bytes():
                      raise SystemExit(f'Regression archive drift: {name}. Refresh the archive; do not overwrite live tests in CI.')
          print(f'OK: regression archive synchronized with {len(names)} live tests')
          PY

      - name: Validate source-package contract independently from hosted assets
        run: |
          test -f SOURCE_SNAPSHOT_MANIFEST_23_19_5_DI2.txt
          grep -qx 'CARD_IMAGE_BINARIES=0' SOURCE_SNAPSHOT_MANIFEST_23_19_5_DI2.txt
          grep -qx 'PUBLIC_FIRESTORE_CONFIG_FILES=0' SOURCE_SNAPSHOT_MANIFEST_23_19_5_DI2.txt
          echo "OK: cumulative delivery remains no-card-images/no-public-Firestore-config; hosted PNGs are allowed"

      - name: Validate complete canonical fast contract sweep
        working-directory: ./argentinia
        run: |
          test -f tools/ci_fast_contract_manifest_23_19_5_di2.txt
          set +e
          total=0
          passed=0
          failed=0
          while IFS= read -r test_file || [ -n "$test_file" ]; do
            [ -z "$test_file" ] && continue
            case "$test_file" in \#*) continue ;; esac
            total=$((total + 1))
            echo "[contract $total] $test_file"
            if [ ! -f "$test_file" ]; then
              failed=$((failed + 1))
              echo "::error file=$test_file::Canonical contract file is missing"
              continue
            fi
            node "$test_file"
            code=$?
            if [ "$code" -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "::error file=$test_file::Contract test failed with exit code $code"
            fi
          done < tools/ci_fast_contract_manifest_23_19_5_di2.txt

          # Web uploads can leave historical test_*.mjs files in the repository. Report
          # them for cleanup, but do not execute files outside the canonical DI2 suite.
          grep -vE '^[[:space:]]*(#|$)' tools/ci_fast_contract_manifest_23_19_5_di2.txt | sort > /tmp/canonical-tests.txt
          find tools -maxdepth 1 -type f -name 'test_*.mjs' -print | sort > /tmp/present-tests.txt
          comm -13 /tmp/canonical-tests.txt /tmp/present-tests.txt > /tmp/stale-tests.txt
          if [ -s /tmp/stale-tests.txt ]; then
            echo "::warning::Ignoring stale non-canonical tests retained by repository uploads:"
            sed 's/^/  - /' /tmp/stale-tests.txt
          fi

          echo "FAST_CONTRACT_SWEEP total=$total passed=$passed failed=$failed canonical=23.19.5-di2"
          if [ "$total" -ne 106 ]; then
            echo "::error::Canonical fast manifest must contain exactly 106 tests; got $total"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed canonical contract test(s) failed. All canonical failures were collected in this single run."
            exit 1
          fi

      - name: Validate Prebuilt Decks Store 23.17.3
        working-directory: ./argentinia
        run: node tools/test_prebuilt_decks_store_23_17_3.mjs

      - name: Validate Prebuilt Purchase Integrity 23.17.3.1
        working-directory: ./argentinia
        run: node tools/test_prebuilt_purchase_integrity_23_17_3_1.mjs

      - name: Validate Build Manifest Freshness 23.17.3.2
        working-directory: ./argentinia
        run: node tools/test_build_manifest_freshness_23_17_3_2.mjs

      - name: Validate Normal Profile + Daily Recovery 23.17.3.3
        working-directory: ./argentinia
        run: node tools/test_normal_profile_daily_recovery_23_17_3_3.mjs

      - name: Validate Daily + Server Clock Runtime Hardening 23.17.3.4
        working-directory: ./argentinia
        run: node tools/test_daily_clock_runtime_hardening_23_17_3_4.mjs

      - name: Validate Firestore Rule Budget Router 23.17.3.5
        working-directory: ./argentinia
        run: node tools/test_firestore_rule_budget_router_23_17_3_5.mjs

      - name: Validate Store + Navigation UX 23.17.4
        working-directory: ./argentinia
        run: node tools/test_store_navigation_ux_23_17_4.mjs

      - name: Validate My Decks Click Hotfix 23.17.4.1
        working-directory: ./argentinia
        run: node tools/test_mydecks_click_hotfix_23_17_4_1.mjs

      - name: Validate Multiplayer Sync + PvP Reward Recovery 23.17.4.2
        working-directory: ./argentinia
        run: node tools/test_multiplayer_sync_reward_recovery_23_17_4_2.mjs

      - name: Validate Gameplay Music 23.17.5
        working-directory: ./argentinia
        run: node tools/test_gameplay_music_23_17_5.mjs

      - name: Validate Bot Flashback + Search Modal Hotfix 23.17.5.1
        working-directory: ./argentinia
        run: node tools/test_bot_flashback_search_modal_23_17_5_1.mjs

      - name: Validate Tano Interactive + Suspend + Rules UX 23.17.5.2
        working-directory: ./argentinia
        run: node tools/test_tano_interactive_suspend_rules_ux_23_17_5_2.mjs

      - name: Validate Selection Modal Drag + Hover 23.17.5.3
        working-directory: ./argentinia
        run: node tools/test_selection_modal_drag_hover_23_17_5_3.mjs

      - name: Validate Bot Reactive Target Reservation 23.17.5.6
        working-directory: ./argentinia
        run: node tools/test_bot_reactive_target_reservation_23_17_5_6.mjs

      - name: Validate Tano Avatar 23.17.5.7
        working-directory: ./argentinia
        run: node tools/test_tano_avatar_23_17_5_7.mjs

      - name: Validate Stability & Replay Foundation 23.18
        working-directory: ./argentinia
        run: |
          node tools/test_stability_replay_foundation_23_18.mjs
          node tools/run_stability_lab_23_18.mjs --seeds 10

      - name: Validate Headless Full Game Lab 23.18.1
        working-directory: ./argentinia
        run: |
          node tools/test_headless_full_game_lab_23_18_1.mjs
          node tools/run_headless_full_game_lab_23_18_1.mjs --games 6 --determinismRuns 2 --concurrency 3 --maxTurns 100 --maxSteps 8000

      - name: Validate Headless Coverage + Failure Minimizer 23.18.2
        working-directory: ./argentinia
        run: |
          node tools/test_headless_coverage_failure_minimizer_23_18_2.mjs
          node tools/audit_headless_coverage_23_18_2.mjs
          node tools/run_headless_full_game_lab_23_18_2.mjs --games 6 --determinismRuns 2 --concurrency 3 --maxTurns 100 --maxSteps 8000 --profile coverage-v2

      - name: Validate Mana Pool UX + Vanilla Rebalance 23.18.3
        working-directory: ./argentinia
        run: node tools/test_mana_pool_ux_vanilla_rebalance_23_18_3.mjs

      - name: Validate Multiplayer Reliability Lab 23.19
        working-directory: ./argentinia
        run: |
          node tools/test_multiplayer_reliability_lab_23_19.mjs
          node tools/run_multiplayer_reliability_lab_23_19.mjs --seeds 250 --commits 120

      - name: Validate Multiplayer Reliability Hardening 23.19.1
        working-directory: ./argentinia
        run: |
          node tools/test_multiplayer_reliability_hardening_23_19_1.mjs
          node tools/run_multiplayer_hardening_lab_23_19_1.mjs --cases 5000

      - name: Validate Reward Settlement Integrity + Admin Black Box 23.19.2
        working-directory: ./argentinia
        run: node tools/test_reward_settlement_integrity_23_19_2.mjs

      - name: Validate Gameplay Semantic + UX Hardening 23.19.3
        working-directory: ./argentinia
        run: node tools/test_gameplay_semantic_ux_hardening_23_19_3.mjs

      - name: Validate Animation Foundation + Combat Impact I 23.19.4
        working-directory: ./argentinia
        run: node tools/test_animation_foundation_combat_impact_23_19_4.mjs

      - name: Validate Admin Daily Runtime Parity 23.19.4
        working-directory: ./argentinia
        run: node tools/test_admin_daily_runtime_parity_23_19_4.mjs

      - name: Validate Combat Impact II + Admin Animation Studio 23.19.4.1
        working-directory: ./argentinia
        run: node tools/test_combat_impact_ii_admin_animation_studio_23_19_4_1.mjs

      - name: Validate Firestore Rules Compiler Hygiene 23.19.4.1
        working-directory: ./argentinia
        run: node tools/test_firestore_rules_compiler_hygiene_23_19_4_1.mjs

      - name: Validate Zone Transitions + Animation Studio 2.1 23.19.4.2
        working-directory: ./argentinia
        run: node tools/test_zone_transitions_animation_studio_23_19_4_2.mjs

      - name: Validate Combat Cinematic + Trigger/Game Over UX 23.19.4.3
        working-directory: ./argentinia
        run: node tools/test_combat_cinematic_trigger_gameover_hotfix_23_19_4_3.mjs

      - name: Validate Animation Tuning Matrix + Draggable Test Console 23.19.4.4
        working-directory: ./argentinia
        run: node tools/test_animation_tuning_matrix_draggable_console_23_19_4_4.mjs

      - name: Validate Animation Actor Parity + SFX Cue Semantics 23.19.4.5
        working-directory: ./argentinia
        run: node tools/test_animation_actor_parity_sfx_cues_23_19_4_5.mjs

      - name: Validate Rules Integrity + Combat UX + Bot Tactical Hotfix 23.19.4.6
        working-directory: ./argentinia
        run: node tools/test_rules_integrity_combat_ux_bot_tactical_hotfix_23_19_4_6.mjs

      - name: Validate Core Gameplay Feedback Expansion 23.19.4.7
        working-directory: ./argentinia
        run: node tools/test_core_gameplay_feedback_expansion_23_19_4_7.mjs

      - name: Validate Mass Event Cinematics + High-Impact Feedback 23.19.4.8
        working-directory: ./argentinia
        run: node tools/test_mass_event_cinematics_high_impact_23_19_4_8.mjs

      - name: Validate Commercial IP Remediation Wave 1 23.19.4.9
        working-directory: ./argentinia
        run: node tools/test_commercial_ip_remediation_wave1_23_19_4_9.mjs

      - name: Validate Commercial IP Remediation Wave 2 23.19.4.10
        working-directory: ./argentinia
        run: node tools/test_commercial_ip_remediation_wave2_23_19_4_10.mjs

      - name: Validate Commercial IP Remediation Wave 3 23.19.4.11
        working-directory: ./argentinia
        run: node tools/test_commercial_ip_remediation_wave3_23_19_4_11.mjs

      - name: Validate Commercial IP Residual YELLOW Closure 23.19.4.12
        working-directory: ./argentinia
        run: node tools/test_commercial_ip_residual_yellow_23_19_4_12.mjs

      - name: Validate Global Terminology Clean-room Wave 4 23.19.4.13
        working-directory: ./argentinia
        run: node tools/test_global_terminology_cleanroom_wave4_23_19_4_13.mjs

      - name: Validate Commercial Readiness Closure Wave 5 23.19.4.14
        working-directory: ./argentinia
        run: node tools/test_commercial_readiness_closure_wave5_23_19_4_14.mjs

      - name: Validate Semidiós Rules Text + Creencia UX Hotfix 23.19.4.15
        working-directory: ./argentinia
        run: node tools/test_semidios_rules_text_creencia_ux_23_19_4_15.mjs

      - name: Validate Economy Authority Foundation 23.19.5
        working-directory: ./argentinia
        run: node tools/test_economy_authority_foundation_23_19_5.mjs

      - name: Validate Economy Authority RC2 Stabilization 23.19.5
        working-directory: ./argentinia
        run: node tools/test_rc2_deck_admin_land_23_19_5.mjs

      - name: Validate Deck Intelligence 2.0 Hotfix 23.19.5
        working-directory: ./argentinia
        run: node tools/test_deck_intelligence_2_23_19_5.mjs

      - name: Audit Deck Intelligence 2.0 Archetype Matrix 23.19.5
        working-directory: ./argentinia
        run: node tools/audit_deck_intelligence_matrix_23_19_5.mjs

      - name: Validate Economy Functions Trusted Foundation 23.19.5
        run: node --test functions/test/foundation.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete polgamero.github.io site
        uses: actions/upload-pages-artifact@v4
        with:
          # IMPORTANT: upload the repository root so Argentinia remains at /argentinia/.
          path: '.'

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

