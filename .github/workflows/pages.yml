name: Deploy Argentinia to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only the default branch; manual runs are also allowed.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Argentinia repository layout
        run: |
          test -d argentinia
          test -f argentinia/tools/generate_image_manifest.py
          test -f argentinia/js/poolContract.js
          test -d argentinia/assets/data
          test -d argentinia/assets/images/cards
          test ! -e argentinia/firestore.rules
          test ! -e argentinia/firebase.json
          echo "OK: polgamero.github.io/argentinia layout detected; no public Firestore infra files"

      - name: Generate card image manifest and validate active pool contract
        working-directory: ./argentinia
        # Cardinality comes from js/poolContract.js. Never hardcode 511/553/583/601 here.
        run: python tools/generate_image_manifest.py --root .

      - name: Verify generated manifest
        run: |
          test -f argentinia/assets/images/cards/cards-image-manifest.json
          test -f argentinia/assets/images/cards/missing-card-images.txt
          test -f argentinia/assets/images/cards/missing-token-images.txt
          test -f argentinia/assets/images/cards/unassigned-token-images.txt
          echo "OK: card + token image manifest generated inside /argentinia"

      - name: Validate Game Texts contract
        working-directory: ./argentinia
        run: python tools/validate_game_text_contract.py --root .

      - name: Validate compact historical regression suite
        working-directory: ./argentinia
        run: |
          test -f tools/regression_legacy_23_17_3_1.zip
          test -f tools/ci_regression_manifest_23_17_3_1.txt
          # The archive is retained as a compact historical artifact, but must NEVER be
          # extracted over the live tools/ tree: doing so can overwrite tests that were
          # intentionally updated for newer engine/rules/protocol baselines.
          python - <<'PY'
          from pathlib import Path
          import zipfile
          tools = Path('tools')
          names = [line.strip() for line in (tools / 'ci_regression_manifest_23_17_3_1.txt').read_text(encoding='utf-8').splitlines()
                   if line.strip() and not line.lstrip().startswith('#')]
          issues = []
          with zipfile.ZipFile(tools / 'regression_legacy_23_17_3_1.zip') as z:
              archived = set(z.namelist())
              for name in names:
                  live = tools / name
                  if not live.is_file():
                      issues.append(f'Missing live regression test: {name}')
                      continue
                  if name not in archived:
                      issues.append(f'Missing regression archive entry: {name}')
                      continue
                  if z.read(name) != live.read_bytes():
                      issues.append(f'Regression archive drift: {name}')
              extras = sorted(archived.difference(names))
              for name in extras:
                  issues.append(f'Unexpected regression archive entry: {name}')
          if issues:
              for issue in issues:
                  print(f'::error::{issue}')
              raise SystemExit(f'Regression archive has {len(issues)} synchronization issue(s). Refresh the archive; do not overwrite live tests in CI.')
          print(f'OK: regression archive synchronized with {len(names)} live tests')
          PY

      - name: Validate source-package contract independently from hosted assets
        run: |
          test -f SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt
          grep -qx 'CARD_IMAGE_BINARIES=0' SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt
          grep -qx 'PUBLIC_FIRESTORE_CONFIG_FILES=0' SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt
          grep -Eq '^CANONICAL_FAST_CONTRACTS=[1-9][0-9]*$' SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt
          grep -Eq '^FUNCTIONS_COUNT=[1-9][0-9]*$' SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt
          echo "OK: source snapshot metadata exposes valid 23.21.6 canonical CI counts"

      - name: Guard canonical ownership of static contracts
        working-directory: ./argentinia
        run: |
          # Static contract/test files must live in the canonical manifest, not as one-off workflow steps.
          if grep -nE 'node tools/(test_[^ ]*\.mjs|[^ ]*contract\.mjs)' ../.github/workflows/pages.yml; then
            echo "::error::Standalone static contract invocation detected. Add it to ci_fast_contract_manifest_23_21_0.txt instead."
            exit 1
          fi
          echo "OK: no standalone static contracts outside canonical manifest"

      - name: Validate complete canonical fast contract sweep
        working-directory: ./argentinia
        run: |
          test -f tools/ci_fast_contract_manifest_23_21_0.txt
          set +e
          total=0
          passed=0
          failed=0
          while IFS= read -r test_file || [ -n "$test_file" ]; do
            [ -z "$test_file" ] && continue
            case "$test_file" in \#*) continue ;; esac
            total=$((total + 1))
            echo "[contract $total] $test_file"
            if [ ! -f "$test_file" ]; then
              failed=$((failed + 1))
              echo "::error file=$test_file::Canonical contract file is missing"
              continue
            fi
            node "$test_file"
            code=$?
            if [ "$code" -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "::error file=$test_file::Contract test failed with exit code $code"
            fi
          done < tools/ci_fast_contract_manifest_23_21_0.txt

          # Web uploads can leave historical test_*.mjs files in the repository. Report
          # them for cleanup, but do not execute files outside the canonical 23.21.x suite.
          grep -vE '^[[:space:]]*(#|$)' tools/ci_fast_contract_manifest_23_21_0.txt | sort > /tmp/canonical-tests.txt
          find tools -maxdepth 1 -type f -name 'test_*.mjs' -print | sort > /tmp/present-tests.txt
          comm -13 /tmp/canonical-tests.txt /tmp/present-tests.txt > /tmp/stale-tests.txt
          if [ -s /tmp/stale-tests.txt ]; then
            echo "::warning::Ignoring stale non-canonical tests retained by repository uploads:"
            sed 's/^/  - /' /tmp/stale-tests.txt
          fi

          echo "FAST_CONTRACT_SWEEP total=$total passed=$passed failed=$failed canonical=23.21.6"
          expected=$(sed -n 's/^CANONICAL_FAST_CONTRACTS=//p' ../SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt)
          if [ -z "$expected" ] || ! printf '%s' "$expected" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::SOURCE_SNAPSHOT_MANIFEST_23_21_6.txt has invalid CANONICAL_FAST_CONTRACTS=$expected"
            exit 1
          fi
          if [ "$total" -ne "$expected" ]; then
            echo "::error::Canonical fast manifest count drift: snapshot expects $expected tests; manifest has $total"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed canonical contract test(s) failed. All canonical failures were collected in this single run."
            exit 1
          fi

      # All canonical static contracts already ran once in the sweep above.
      # Historically we ran 51 of those files a SECOND time as individually named steps,
      # which added substantial wall-clock time without adding coverage. Keep only the
      # stateful/dynamic labs and audits that are NOT part of the canonical manifest.
      - name: Run dynamic reliability labs once
        working-directory: ./argentinia
        run: |
          node tools/run_stability_lab_23_18.mjs --seeds 10
          node tools/run_headless_full_game_lab_23_18_1.mjs --games 6 --determinismRuns 2 --concurrency 3 --maxTurns 100 --maxSteps 8000
          node tools/audit_headless_coverage_23_18_2.mjs
          node tools/run_headless_full_game_lab_23_18_2.mjs --games 6 --determinismRuns 2 --concurrency 3 --maxTurns 100 --maxSteps 8000 --profile coverage-v2
          node tools/run_multiplayer_reliability_lab_23_19.mjs --seeds 250 --commits 120
          node tools/run_multiplayer_hardening_lab_23_19_1.mjs --cases 5000
          node tools/audit_deck_intelligence_matrix_23_19_5.mjs

      - name: Validate Functions syntax + Economy/Tournament/Trade/Social unit suite 23.21.6
        working-directory: ./functions
        run: |
          npm run lint:syntax
          npm test

      - name: Build Argentinia as the public site root
        run: node argentinia/tools/build_pages_root_23_21_6_hf23_3_9.mjs --source argentinia --dest .pages-root --repo-root .

      - name: Verify public-root migration artifact
        run: |
          test -f .pages-root/index.html
          test -f .pages-root/js/main.js
          test -f .pages-root/assets/manifest.webmanifest
          test -f .pages-root/argentinia/index.html
          grep -q 'Argentinia ahora vive' .pages-root/argentinia/index.html
          echo "OK: Argentinia is the public / root; /argentinia/ is a legacy redirect"

      - name: Verify crawler and monetization root artifact
        run: |
          test -f .pages-root/ads.txt
          test -f .pages-root/robots.txt
          test -f .pages-root/sitemap.xml
          test -f .pages-root/CNAME
          grep -Fxq 'google.com, pub-6181395403710642, DIRECT, f08c47fec0942fa0' .pages-root/ads.txt
          grep -q 'google-adsense-account.*ca-pub-6181395403710642' .pages-root/index.html
          grep -q 'rel="canonical" href="https://magiayleyenda.com.ar/"' .pages-root/index.html
          grep -q '^User-agent: Mediapartners-Google$' .pages-root/robots.txt
          grep -q '^User-agent: Google-Display-Ads-Bot$' .pages-root/robots.txt
          grep -q 'https://magiayleyenda.com.ar/' .pages-root/sitemap.xml
          echo "OK: AdSense/crawler files and semantic metadata are published at root"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Argentinia public-root site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-root'

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

