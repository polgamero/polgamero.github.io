name: Deploy Argentinia Public Frontend to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Enforce public-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d argentinia
          test -f argentinia/index.html
          test -f argentinia/build-manifest.json
          test -d argentinia/js
          test -d argentinia/css
          test -d argentinia/assets/data
          test -f argentinia/assets/images/cards/cards-image-manifest.json
          test -f argentinia/cartas/index.html
          test ! -e functions
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -d argentinia/tools

          forbidden_dirs=$(find . -path './.git' -prune -o -type d \( -name trusted -o -name test -o -name tests -o -name node_modules \) -print)
          if [ -n "$forbidden_dirs" ]; then
            echo "::error::Private/internal directories found in public repository:"
            printf '%s\n' "$forbidden_dirs"
            exit 1
          fi

          forbidden_files=$(find argentinia -type f \( -name '*.mjs' -o -name '*.py' -o -name '*.md' -o -name '*.txt' -o -name '*.zip' -o -name '*.patch' -o -name '*.log' \) -print)
          if [ -n "$forbidden_files" ]; then
            echo "::error::Internal/test/documentation files found under public argentinia/:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          if grep -RIlE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:' argentinia .github 2>/dev/null | grep -q .; then
            echo "::error::Private-key material marker detected in public repository"
            exit 1
          fi
          echo "PUBLIC_REPOSITORY_BOUNDARY_OK runtime-only"

      - name: Verify prebuilt public gallery and crawler assets
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          test -f ads.txt
          test -f robots.txt
          test -f sitemap.xml
          test -f argentinia/cartas/public-selection.json
          test -f argentinia/cartas/public-cards.css
          test -f argentinia/cartas/public-cards.js
          test "$(find argentinia/cartas -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "180"
          test "$(grep -c '<loc>' sitemap.xml)" = "182"
          echo "PUBLIC_ARTIFACTS_OK gallery=180 sitemap=182"

      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-root
          mkdir -p .pages-root
          cp -a argentinia/. .pages-root/
          for name in CNAME ads.txt robots.txt sitemap.xml .nojekyll; do
            if [ -f "$name" ]; then cp "$name" ".pages-root/$name"; fi
          done
          mkdir -p .pages-root/argentinia
          cat > .pages-root/argentinia/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0;url=/"><title>Argentinia se mudó</title></head>
          <body><p>Argentinia ahora vive en <a href="/">la raíz del sitio</a>.</p>
          <script>try{const u=new URL('/',location.origin);u.search=location.search;u.hash=location.hash;location.replace(u.href);}catch{location.replace('/');}</script>
          </body></html>
          HTML
          test -f .pages-root/index.html
          test -f .pages-root/js/main.js
          test -f .pages-root/assets/manifest.webmanifest
          test -f .pages-root/cartas/index.html
          echo "PUBLIC_PAGES_ARTIFACT_OK"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-root'

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
